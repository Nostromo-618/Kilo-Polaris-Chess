name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: This app consumes @vanduo-oss/vd3 (Vue 3 UI), published on npm and pinned
# to a semver range (`^1.0.0`), so `pnpm install --frozen-lockfile` resolves it
# cleanly on a CI runner from the committed lockfile.

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run quick tests
        run: pnpm run test:quick

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  full-game:
    name: Full game tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run full game tests
        run: pnpm run test:full-game

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-game-report
          path: playwright-report/
          retention-days: 14
