name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages.
#
# NOTE: Requires @vanduo-oss/vd3 to be resolvable on the runner. While it is a
# local `link:../../0_vanduo/vd3` dependency (pre-publish), `pnpm install` fails
# on CI — flip the dependency to a published range before enabling this workflow
# (see README "Building & deploying"). The default Vite `base` is
# `/aurora-polaris-chess/` (a GitHub Pages project site); override with the
# VITE_BASE env var for a user/organization site or a custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
