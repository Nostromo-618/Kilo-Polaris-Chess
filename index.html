<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Aurora Polaris Chess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern browser chess vs computer with 6 difficulty levels, a strong UCI engine, and engine-vs-engine matches. UI powered by Vanduo UI." />

  <!-- Phosphor Icons (Duotone) — the one weight vd3 does not ship; served as a static asset -->
  <link rel="stylesheet" href="%BASE_URL%icons/phosphor/duotone/style.css" />

  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />

  <!-- Apply the persisted theme before first paint to avoid a flash of the wrong theme.
       vd3's theme layer reads the same `vanduo-theme-preference` key and takes over on mount. -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('vanduo-theme-preference') || localStorage.getItem('kpc-theme');
        if (p === 'light' || p === 'dark') {
          document.documentElement.setAttribute('data-theme', p);
        }
      } catch (e) { /* private mode / storage disabled — fall back to system */ }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
